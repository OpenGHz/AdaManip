task:
  task_name: "open_microwave"
  policy: "adaptive"
  num_episode: 1
  grasp: False

model:
  policy_mode: diffusion
  obs_horizon: 2
  action_horizon: 1
  pred_horizon: 4
  num_diffusion_iters: 5
  flow_sampling_steps: 5
  flow_beta_alpha: 1.5
  flow_beta_beta: 1.0
  flow_tau_cutoff: 0.999
  discrete: False
  input_feat: 3
  feat_dim: 128
  dof_dim: 0
  action_dim: 10
  Transformer: False
  grasp: False
  grasp_model_path: None
  diffusion_model_path: logs/Mar09/19-17-36/ema_nets.pth

env:
  env_name: "open microwave"
  numEnvs: 1
  numObservations: 26
  numActions: 10
  envSpacing: 2.0
  horizon: 30
  clockwise: 0.5
  randomPose: 0.00
  pc_normalize: True
  actionSpeedScale: 20
  enableDebugVis: False

  enableCameraSensors: True
  enableForceSensors: False

  collectData: False
  collect_all: False
  start_index: 0
  collectDataPath: "microwave/ipc_eval_smoke"
  collectPC: False
  collectRGBVideo: False
  collectForce: False
  visualizePointcloud: False
  PointDownSampleNum: 512
  rgbVideo:
    cameraType: fixed
    cameraIds: []
    fps: 10
    codec: libx264
    crf: 18
    preset: fast

  reset:
    bottle:
      resetPositionNoise: 0.0
      resetRotationNoise: 0.0
      resetDofPosRandomInterval: 0.0
      resetDofVelRandomInterval: 0.0
    franka:
      resetPositionNoise: 0.0
      resetRotationNoise: 0.0
      resetDofPosRandomInterval: 0.0
      resetDofVelRandomInterval: 0.0

  driveMode: "osc"
  clipObservations: 5.0
  clipActions: 1.0
  cam:
    width: 64
    height: 64
    cam_far_plane: 100
    cam_near_plane: 0.01
    cam_horizontal_fov: 85
    cam_start:
      - [0.15, -0.5, 0.8]
      - [0.15, 0.5, 0.8]
    cam_target:
      - [0, 0, 0.7]
      - [0, 0, 0.7]

  asset:
    assetRoot: "./assets"
    datasetPath: "microwave"
    AssetNum: 1
    randomAsset: False
    load_block: "test"
    StartID: 0
    Assets:
      'test':
        'mv_2':
          bounding_box: mv_2/bounding_box.json
          name: 'mv_2'
          path: mv_2/mobility.urdf

sim:
  substeps: 2
  physx:
    num_threads: 4
    solver_type: 1
    num_position_iterations: 8
    num_velocity_iterations: 0
    contact_offset: 0.002
    rest_offset: 0.0
    bounce_threshold_velocity: 0.2
    max_depenetration_velocity: 1000.0
    default_buffer_size_multiplier: 5.0
  flex:
    num_outer_iterations: 5
    num_inner_iterations: 20
    warm_start: 0.8
    relaxation: 0.75