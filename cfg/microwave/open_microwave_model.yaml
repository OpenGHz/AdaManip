task:
  task_name: "open_microwave"
  policy: "adaptive"
  num_episode: 1
  grasp: False

  # Dump per-(episode, env) data in a layout that scripts/eval_video2prompt.py
  # can replay (videos + 10-D action arrays + minimal_chain labels + ...).
  # Independent of adaptive_language.enable: turn this on for pure
  # data-collection rollouts (closed-loop Stage 2) where you only want the
  # dump and skip any online asker. Forces a flat rgb_videos/episode_<eps>/
  # layout (overrides adaptive_language.asker.recategorize_videos). Requires
  # env.collectRGBVideo=true to actually save mp4s.
  save_inference_data: true

  # Adaptive language-conditioning eval loop. When enabled, each env runs an
  # independent state machine across episodes: the first episode for each env
  # samples clock_wise and a random chain id, calls the asker on the rollout
  # video+actions, and locks the asker's chain id on success. Subsequent
  # episodes freeze that env's clock_wise; locked envs reuse their chain id,
  # unlocked envs draw the next untried chain id from the bank. Default OFF
  # preserves the existing per-episode random behavior.
  adaptive_language:
    enable: true
    max_retry_rounds: 3
    asker:
      platform: ground-truth        # ground-truth | codex-cli | claude-cli | gemini | foxcode | ""
      model: gpt-5.5
      mock: false
      prompt_style: structured
      check_success: together
      frame_max_count: 12
      frame_stride: 1
      camera_id: 1
      trajectory_context: true
      trajectory_representation: delta
      trajectory_sample_points: 0
      recategorize_videos: true
      lock_on_env_success: false
      claude_cli_command: claude
      claude_cli_skip_permissions: true
      claude_cli_timeout: 900
      codex_cli_command: codex
      codex_cli_timeout: 900
      codex_cli_sandbox: read-only
      codex_cli_approval_policy: never
      codex_cli_cd: ""
      codex_cli_ephemeral: true
      codex_cli_effort: xhigh
      gemini_temperature: 1.0
      gemini_thinking_budget: -1
      gemini_image_thinking_budget: 0
      gemini_upload_poll_interval: 1.0
      gemini_upload_timeout: 600

model:
  policy_mode: diffusion
  # policy_mode: flow_matching
  obs_horizon: 2
  action_horizon: 1
  pred_horizon: 4
  num_diffusion_iters: 100
  flow_sampling_steps: 100
  flow_beta_alpha: 1.5
  flow_beta_beta: 1.0
  flow_tau_cutoff: 0.999
  discrete: False
  input_feat: 3
  feat_dim: 128
  dof_dim: 0
  action_dim: 10
  Transformer: False
  grasp: False 
  grasp_model_path: None
  # model_path: './ckpt/microwave/microwave_manip.pth'
  # model_path: logs/Mar09/19-17-36/ema_nets.pth
  # diffusion_model_path: logs/Mar10/10-53-38/ema_nets.pth
  # diffusion_model_path: logs/Mar09/19-17-36/ema_nets.pth
  # diffusion_model_path: logs/microwave/manip/Mar17/11-21-07/ema_nets.pth
  diffusion_model_path: logs/microwave/manip/Mar17/13-38-17/ema_nets.pth
  use_language_conditioning: True
  language_input_dim: 512
  language_proj_dim: 128
  # language_embedding_dict_path: logs/microwave/manip/Mar17/11-21-07/language_embedding_dict.json

env:
  env_name: "open microwave"
  numEnvs: 10
  numObservations: 26
  numActions: 10
  envSpacing: 2.0
  horizon: 30
  clockwise: 0.5
  randomPose: 0.00
  pc_normalize: True
  actionSpeedScale: 20
  enableDebugVis: False

  enableCameraSensors: True
  enableForceSensors: False

  collectData: True
  collect_all: True
  start_index: 80
  collectDataPath: "microwave/0" # ../logs/_seed{}/***
  collectPC: False
  collectRGBVideo: True
  collectForce: True
  visualizePointcloud: False
  PointDownSampleNum: 2048
  rgbVideo:
    cameraType: fixed
    cameraIds: []
    fps: 10
    codec: libx264
    crf: 18
    preset: fast

  reset:
    bottle:
      resetPositionNoise: 0.0
      resetRotationNoise: 0.0
      resetDofPosRandomInterval: 0.0
      resetDofVelRandomInterval: 0.0
    franka:
      resetPositionNoise: 0.0
      resetRotationNoise: 0.0
      resetDofPosRandomInterval: 0.0
      resetDofVelRandomInterval: 0.0

  driveMode: "osc"
  clipObservations: 5.0
  clipActions: 1.0
  cam: 
    width: 128
    height: 128
    cam_far_plane: 100
    cam_near_plane: 0.01
    cam_horizontal_fov: 85
    cam_start:
      - [0.15, -0.5, 0.8]
      - [0.15, 0.5, 0.8]
      # - [-0.1, -0.17, 0.5]
    cam_target: 
      - [0, 0, 0.7]
      - [0, 0, 0.7]
      # - [0, 0, 0.4]

  asset:
    assetRoot: "./assets"
    datasetPath: "microwave"
    AssetNum: 10
    randomAsset: False
    load_block: "test"
    StartID: 0
    Assets:
      'test':
        'mv_2':
          bounding_box: mv_2/bounding_box.json
          name: 'mv_2'
          path: mv_2/mobility.urdf
        'mv_3':
          bounding_box: mv_3/bounding_box.json
          name: 'mv_3'
          path: mv_3/mobility.urdf
        'mv_4':
          bounding_box: mv_4/bounding_box.json
          name: 'mv_4'
          path: mv_4/mobility.urdf
        'mv_5':
          bounding_box: mv_5/bounding_box.json
          name: 'mv_5'
          path: mv_5/mobility.urdf
        'mv_6':
          bounding_box: mv_6/bounding_box.json
          name: 'mv_6'
          path: mv_6/mobility.urdf
        'mv_7':
          bounding_box: mv_7/bounding_box.json
          name: 'mv_7'
          path: mv_7/mobility.urdf
        'mv_8':
          bounding_box: mv_8/bounding_box.json
