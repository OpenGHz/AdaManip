task:
  task_name: "open_bottle"
  policy: "adaptive"
  num_episode: 20
  num_eval_episode: 10
  seed: 0
  max_step: 24

  save_inference_data: true

  adaptive_language:
    enable: false
    max_retry_rounds: 3
    asker:
      platform: ground-truth        # ground-truth | codex-cli | claude-cli | gemini | foxcode | ""
      model: gpt-5.5
      mock: false
      prompt_style: structured
      check_success: together
      frame_max_count: 12
      frame_stride: 1
      camera_id: 1
      trajectory_context: true
      trajectory_representation: delta
      trajectory_sample_points: 0
      recategorize_videos: true
      lock_on_env_success: false
      claude_cli_command: claude
      claude_cli_skip_permissions: true
      claude_cli_timeout: 900
      codex_cli_command: codex
      codex_cli_timeout: 900
      codex_cli_sandbox: read-only
      codex_cli_approval_policy: never
      codex_cli_cd: ""
      codex_cli_ephemeral: true
      codex_cli_effort: xhigh
      gemini_temperature: 1.0
      gemini_thinking_budget: -1
      gemini_image_thinking_budget: 0
      gemini_upload_poll_interval: 1.0
      gemini_upload_timeout: 600

model:
  policy_mode: diffusion
  # policy_mode: flow_matching
  obs_horizon: 2
  action_horizon: 1
  pred_horizon: 4
  num_diffusion_iters: 100
  flow_sampling_steps: 100
  flow_beta_alpha: 1.5
  flow_beta_beta: 1.0
  flow_tau_cutoff: 0.999
  discrete: False
  input_feat: 3
  feat_dim: 128
  dof_dim: 0
  action_dim: 9 
  Transformer: False
  n_layer: 8
  n_cond_layers: 0
  n_head: 4
  n_emb: 256
  p_drop_emb: 0.0
  p_drop_attn: 0.3
  causal_attn: True
  time_as_cond: True
  pred_action_steps_only: False

  grasp: True # model grasp
  grasp_model_path: './ckpt/bottle/bottle_grasp.pth'
  diffusion_model_path:  './ckpt/bottle/bottle_manip.pth'
  use_language_conditioning: True
  language_input_dim: 512
  language_proj_dim: 128
  # language_embedding_dict_path: <checkpoint-dir>/language_embedding_dict.json

train:
  manip:
    dataset_path:
      - ./demo_data/open_bottle_manip_adaptive_7_eps20_clock0.5/demo_data.zip
    batch_size: 28
    num_epochs: 800
  grasp:
    dataset_path:
      - ./demo_data/open_bottle_grasp_adaptive_7_eps20_clock0.5/demo_data.zip
    batch_size: 64
    num_epochs: 800

  collectData: False


env:
  env_name: "open bottle"
  numEnvs: 7
  numObservations: 26
  numActions: 9
  envSpacing: 2.0
  horizon: 50
  clockwise: 0.5
  actionSpeedScale: 20
  enableDebugVis: False

  enableCameraSensors: True
  enableForceSensors: False

  collectData: True
  collect_all: True
  collectPC: False
  collectForce: True
  visualizePointcloud: False
  PointDownSampleNum: 4096

  reset:
    bottle:
      resetPositionNoise: 0.0
      resetRotationNoise: 0.0
      resetDofPosRandomInterval: 0.0
      resetDofVelRandomInterval: 0.0
    franka:
      resetPositionNoise: 0.0
      resetRotationNoise: 0.0
      resetDofPosRandomInterval: 0.0
      resetDofVelRandomInterval: 0.0

  driveMode: "osc"
  clipObservations: 5.0
  clipActions: 1.0
  cam: 
    width: 512
    height: 512
    cam_far_plane: 2
    cam_near_plane: 0.01
    cam_horizontal_fov: 85
    cam_start:
      - [0, -0.3, 0.57]
      - [0, 0.3, 0.57]
    cam_target: 
      - [0, 0, 0.2]
      - [0, 0, 0.2]

  asset:
    assetRoot: "./assets"
    datasetPath: "bottle"
    AssetNum: 7
    randomAsset: False
    load_block: "test"
    limit_random: 0.5
    Assets:
      'test':
        'b1':
          bounding_box: b1/bounding_box.json
          name: 'b1'
          path: b1/mobility.urdf
        'b2':
          bounding_box: b2/bounding_box.json
          name: 'b2'
          path: b2/mobility.urdf
        'b6':
          bounding_box: b6/bounding_box.json
          name: 'b6'
          path: b6/mobility.urdf
        'b12':
          bounding_box: b12/bounding_box.json
          name: 'b12'
          path: b12/mobility.urdf
        'b10':
          bounding_box: b10/bounding_box.json
          name: 'b10'
          path: b10/mobility.urdf
        'b15':
          bounding_box: b15/bounding_box.json
          name: 'b15'
          path: b15/mobility.urdf
        'b7':
          bounding_box: b7/bounding_box.json
          name: 'b7'
          path: b7/mobility.urdf

sim:
  substeps: 2
  physx:
    num_threads: 4
    solver_type: 1  # 0: pgs, 1: tgs
    num_position_iterations: 8
    num_velocity_iterations: 0
    contact_offset: 0.002
    rest_offset: 0.0
    bounce_threshold_velocity: 0.2
    max_depenetration_velocity: 1000.0
    default_buffer_size_multiplier: 5.0
  flex:
    num_outer_iterations: 5
    num_inner_iterations: 20
    warm_start: 0.8
    relaxation: 0.75