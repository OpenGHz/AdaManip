task:
  task_name: "open_door"
  policy: "adaptive"
  num_episode: 20
  num_eval_episode: 10
  max_step: 30

  save_inference_data: true

  adaptive_language:
    enable: false
    max_retry_rounds: 3
    asker:
      platform: ground-truth        # ground-truth | codex-cli | claude-cli | gemini | foxcode | ""
      model: gpt-5.5
      mock: false
      prompt_style: structured
      check_success: together
      frame_max_count: 12
      frame_stride: 1
      camera_id: 1
      trajectory_context: true
      trajectory_representation: delta
      trajectory_sample_points: 0
      recategorize_videos: true
      lock_on_env_success: false
      claude_cli_command: claude
      claude_cli_skip_permissions: true
      claude_cli_timeout: 900
      codex_cli_command: codex
      codex_cli_timeout: 900
      codex_cli_sandbox: read-only
      codex_cli_approval_policy: never
      codex_cli_cd: ""
      codex_cli_ephemeral: true
      codex_cli_effort: xhigh
      gemini_temperature: 1.0
      gemini_thinking_budget: -1
      gemini_image_thinking_budget: 0
      gemini_upload_poll_interval: 1.0
      gemini_upload_timeout: 600

model:
  policy_mode: diffusion
  # policy_mode: flow_matching
  obs_horizon: 2
  action_horizon: 1
  pred_horizon: 4
  num_diffusion_iters: 100
  flow_sampling_steps: 100
  flow_beta_alpha: 1.5
  flow_beta_beta: 1.0
  flow_tau_cutoff: 0.999
  discrete: False
  input_feat: 3
  feat_dim: 128
  dof_dim: 0
  action_dim: 9 
  Transformer: False

  grasp: True 
  grasp_model_path: './ckpt/door/door_grasp.pth'
  diffusion_model_path:  './ckpt/door/door_manip.pth'
  use_language_conditioning: True
  language_input_dim: 512
  language_proj_dim: 128
  # language_embedding_dict_path: <checkpoint-dir>/language_embedding_dict.json

train:
  manip:
    dataset_path:
      - ./demo_data/open_door_manip_adaptive_8_eps20_clock0.5/demo_data.zip
    batch_size: 64
    num_epochs: 800
  grasp:
    dataset_path:
      - ./demo_data/open_door_grasp_adaptive_8_eps20_clock0.5/demo_data.zip
    batch_size: 64
    num_epochs: 800

env:
  env_name: "open door"
  numEnvs: 8
  numObservations: 26
  numActions: 9
  envSpacing: 2.0
  horizon: 35
  clockwise: 0.5
  actionSpeedScale: 20
  enableDebugVis: False

  enableCameraSensors: True
  enableForceSensors: False

  collectData: True
  collectPC: False
  collectForce: True
  visualizePointcloud: False
  PointDownSampleNum: 4096

  reset:
    bottle:
      resetPositionNoise: 0.0
      resetRotationNoise: 0.0
      resetDofPosRandomInterval: 0.0
      resetDofVelRandomInterval: 0.0
    franka:
      resetPositionNoise: 0.0
      resetRotationNoise: 0.0
      resetDofPosRandomInterval: 0.0
      resetDofVelRandomInterval: 0.0

  driveMode: "osc"
  clipObservations: 5.0
  clipActions: 1.0
  cam: 
    width: 512
    height: 512
    cam_far_plane: 100
    cam_near_plane: 0.01
    cam_horizontal_fov: 85
    cam_start:
      - [0.15, -0.45, 2.0]
      - [0.15, 0.45, 2.0]
      # - [-0.1, -0.17, 0.5]
    cam_target: 
      - [0, 0, 1.0]
      - [0, 0, 1.0]
      # - [0, 0, 0.4]

  asset:
    assetRoot: "./assets"
    datasetPath: "door"
    AssetNum: 8
    randomAsset: False
    load_block: "test"
    limit_random: 0.5
    Assets:     
      'test':
        '99691179962011':
          bounding_box: 99691179962011/bounding_box.json
          name: '99691179962011'
          path: 99691179962011/mobility.urdf
        '99689949962039':
          bounding_box: 99689949962039/bounding_box.json
          name: '99689949962039'
          path: 99689949962039/mobility.urdf
        '99655039962013':
          bounding_box: 99655039962013/bounding_box.json
          name: '99655039962013'
          path: 99655039962013/mobility.urdf
        '99690419962022':
          bounding_box: 99690419962022/bounding_box.json
          name: '99690419962022'
          path: 99690419962022/mobility.urdf
        '99660039962007':
          bounding_box: 99660039962007/bounding_box.json
          name: '99660039962007'
